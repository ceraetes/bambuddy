name: Integration build watch

# Polls integration branch SHAs on ceraetes/ci and starts the integration build
# via workflow_call when anything changed.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - ceraetes/ci
    paths:
      - '.github/integration-branches'
      - '.github/integration-build-fingerprint'
      - '.github/workflows/integration-build-watch.yml'
      - '.github/workflows/build-integration-dev.yml'
      - '.github/scripts/integration-branches.sh'
      - '.github/scripts/integration-merge.sh'

concurrency:
  group: integration-build-watch
  cancel-in-progress: true

jobs:
  check:
    name: Detect integration branch changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Checkout ceraetes/ci
        uses: actions/checkout@v4
        with:
          ref: ceraetes/ci
          fetch-depth: 0

      - name: Compare integration fingerprint
        id: compare
        run: |
          git config core.fileMode false
          CURRENT=$(bash .github/scripts/integration-branches.sh fingerprint)
          STORED=""
          if [ -f .github/integration-build-fingerprint ]; then
            STORED=$(tr -d '[:space:]' < .github/integration-build-fingerprint)
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current:  $CURRENT"
          echo "Stored:   ${STORED:-<none>}"
          if [ "$STORED" = "$CURRENT" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No integration branch changes — skip build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Integration inputs changed — will trigger build."
          fi

      - name: Up to date
        if: steps.compare.outputs.changed != 'true'
        run: echo "Integration fingerprint unchanged."

  integration-build:
    name: Build integration dev image
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build-integration-dev.yml
    secrets: inherit
    with:
      reason: watch
