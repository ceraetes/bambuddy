name: Build integration dev image

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this build was started
        required: false
        default: manual
  workflow_run:
    workflows: [Trigger integration build]
    types: [completed]
  workflow_call:
    inputs:
      reason:
        description: Why this build was started
        type: string
        required: false
        default: ''
  push:
    branches:
      - ceraetes/ci
    paths:
      - '.github/workflows/build-integration-dev.yml'
      - '.github/scripts/integration-branches.sh'
      - '.github/scripts/integration-merge.sh'

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: build-integration-dev
  cancel-in-progress: true

jobs:
  build-push:
    name: Merge dev + features, push ghcr.io/ceraetes/bambuddy:dev
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ceraetes/ci
        uses: actions/checkout@v6
        with:
          ref: ceraetes/ci
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch branches
        id: fetch
        run: |
          git config core.fileMode false
          git fetch origin dev
          while IFS= read -r b; do
            [ -n "$b" ] || continue
            git fetch origin "$b" || { echo "ERROR: could not fetch origin/$b"; exit 1; }
          done < <(bash .github/scripts/integration-branches.sh list)
          echo "fingerprint=$(bash .github/scripts/integration-branches.sh fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Validate merge order
        run: bash .github/scripts/integration-branches.sh validate

      - name: Merge dev and integration branches
        id: merge
        run: |
          git config core.fileMode false
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          set +e
          merge_out=$(bash .github/scripts/integration-merge.sh 2>&1)
          merge_rc=$?
          set -e
          echo "$merge_out"
          if [ "$merge_rc" -ne 0 ]; then
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "status=clean" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$merge_out" | grep '^sha=' | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Open issue on merge conflict
        if: failure() && steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(cat /tmp/conflict-files.txt 2>/dev/null || echo "(could not list files)")
          BODY_FILE=$(mktemp)
          {
            echo "Integration merge of \`origin/dev\` plus branches in \`.github/integration-branches\` failed."
            echo ""
            echo "**Conflicting files:**"
            echo '```'
            echo "$FILES"
            echo '```'
            echo ""
            echo "Rebase feature branches onto latest \`dev\` (respect merge order in integration-branches), push, then re-run this workflow."
          } > "$BODY_FILE"
          gh issue create \
            --title "Integration dev build failed: merge conflict" \
            --body-file "$BODY_FILE" || echo "::warning::Could not create issue"

      - name: Log in to GHCR
        if: success()
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: success()
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: success()
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: success()
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ceraetes/bambuddy:dev

      - name: Verify push digest
        if: success()
        run: |
          echo "Integration SHA: ${{ steps.merge.outputs.sha }}"
          echo "Triggered by: ${{ inputs.reason || format('push:{0}', github.event.workflow_run.head_branch) || github.event_name }}"
          echo "Pushed digest: ${{ steps.build.outputs.digest }}"
          if [ -z "${{ steps.build.outputs.digest }}" ]; then
            echo "ERROR: Build step did not produce a digest"
            exit 1
          fi

      - name: Checkout ceraetes/ci for fingerprint
        if: success()
        uses: actions/checkout@v6
        with:
          ref: ceraetes/ci
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record integration fingerprint
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "${{ steps.fetch.outputs.fingerprint }}" > .github/integration-build-fingerprint
          git add .github/integration-build-fingerprint
          git diff --staged --quiet || git commit -m "chore(ci): record integration build fingerprint"
          git push origin ceraetes/ci

      - name: Notify HA add-on repo
        if: success()
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HA_REPO_PAT }}
          repository: ceraetes/homeassistant-app-bambuddy
          event-type: dev-image-pushed
          client-payload: >-
            {"digest":"${{ steps.build.outputs.digest }}","ref":"${{ steps.merge.outputs.sha }}"}
