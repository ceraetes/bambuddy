name: Build dev image

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-dev-image
  cancel-in-progress: true

jobs:
  build-push:
    name: Build and push ghcr.io/ceraetes/bambuddy:dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ceraetes/bambuddy:dev

      - name: Resolve pushed manifest digest
        id: digest
        run: |
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:ceraetes/bambuddy:pull" \
            | jq -r '.token')
          DIGEST=$(curl -sI -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/ceraetes/bambuddy/manifests/dev" \
            | grep -i "docker-content-digest" | tr -d '\r' | awk '{print $2}')
          if [ -z "$DIGEST" ]; then
            echo "ERROR: Could not resolve dev image digest after push"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed digest: $DIGEST"

      - name: Notify HA add-on repo
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HA_REPO_PAT }}
          repository: ceraetes/homeassistant-app-bambuddy
          event-type: dev-image-pushed
          client-payload: >-
            {"digest":"${{ steps.digest.outputs.digest }}","ref":"${{ github.sha }}"}
