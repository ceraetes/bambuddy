name: Trigger integration build

# Runs on the pushed feature branch. When this workflow completes, the
# workflow_run listener on ceraetes/ci starts build-integration-dev.yml.
# (GITHUB_TOKEN cannot call workflow_dispatch on another workflow.)
on:
  push:
    branches-ignore:
      - dev
      - main
      - ceraetes/ci
      - 'backup/**'

concurrency:
  group: trigger-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ping:
    name: Signal integration rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Log branch
        run: echo "Integration rebuild requested for ${GITHUB_REF}"
